name: Build script package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          package-manager-cache: false
          node-version: 24
      - run: npm run check
      - run: npm test
      - run: npm run build:release
      - run: npm run verify:release
      - uses: actions/upload-artifact@v4
        with:
          name: script-packages
          path: |
            dist/*-macos-scripts.zip
            dist/*-macos-scripts.zip.sha256
            dist/*-windows-scripts.zip
            dist/*-windows-scripts.zip.sha256
            dist/*-skill.zip
            dist/*-skill.zip.sha256
          if-no-files-found: error
