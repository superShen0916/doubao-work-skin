name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: git diff --exit-code
